<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | Marudham Smart City Waste Collection Optimization System</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap');

    :root {
      --bg: #f3f6f4;
      --card: #ffffff;
      --line: #e2e8e5;
      --text: #111e19;
      --text-muted: #53645c;
      --primary: #047857;
      --primary-hover: #065f46;
      --primary-light: #ecfdf5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 36px 32px;
      width: min(440px, 100%);
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .brand-icon {
      width: 44px; height: 44px;
      background: var(--primary);
      color: #fff;
      border-radius: 12px;
      display: grid; place-items: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .brand-header b { font-family: 'Manrope', sans-serif; font-size: 18px; display: block; color: var(--text); }
    .brand-header small { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

    h1 {
      font-family: 'Manrope', sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }
    p.sub {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }
    input {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
      background: #fff;
      transition: border-color 0.15s;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(4,120,87,0.1);
    }

    button.btn-login {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    button.btn-login:hover { background: var(--primary-hover); }
    button.btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .err-msg {
      color: #dc2626;
      font-size: 12.5px;
      margin-top: 12px;
      min-height: 18px;
      text-align: center;
      font-weight: 500;
    }

    .demo-creds {
      background: var(--primary-light);
      border: 1px solid #a7f3d0;
      border-radius: 8px;
      padding: 12px;
      margin-top: 22px;
      font-size: 11.5px;
      line-height: 1.6;
      color: #065f46;
    }
    .demo-creds b { display: block; margin-bottom: 4px; font-size: 12px; }

    .foot-link {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }
    .foot-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .foot-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <form class="login-card" id="loginForm" onsubmit="handleLogin(event)">
    <div class="brand-header">
      <div class="brand-icon">♻</div>
      <div>
        <b>Marudham Smart City</b>
        <small id="portalBadge">OPTIMIZATION SYSTEM</small>
      </div>
    </div>

    <h1 id="titleText">Sign In to Continue</h1>
    <p class="sub" id="subText">Enter your credentials to access your dashboard.</p>

    <div>
      <label for="username">Username</label>
      <input id="username" autocomplete="username" placeholder="Username" required autofocus>
    </div>

    <div>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
    </div>

    <button class="btn-login" type="submit" id="btnLogin">Sign In →</button>
    <div class="err-msg" id="errMsg"></div>

    <div class="demo-creds">
      <b>Municipal Role Credentials:</b>
      • <b>Admin:</b> <code>admin</code> / <code>admin123</code><br>
      • <b>Driver:</b> <code>driver1</code> / <code>driver123</code><br>
      • <b>Citizen:</b> <code>citizen1</code> / <code>citizen123</code>
    </div>

    <div class="foot-link">
      Need a new citizen account? <a href="/signup.html">Create an Account</a>
    </div>
  </form>

  <script>
    const $ = s => document.querySelector(s);

    // Fetch site info
    fetch('/api/auth/info').then(r => r.json()).then(i => {
      if (i.site === 'user') {
        $('#portalBadge').textContent = 'CITIZEN PORTAL';
        $('#titleText').textContent = 'Citizen Sign In';
        $('#subText').textContent = 'Sign in to submit and track your waste collection requests.';
      } else {
        $('#portalBadge').textContent = 'ADMIN & OPERATIONS CONSOLE';
      }
    }).catch(() => {});

    async function handleLogin(e) {
      e.preventDefault();
      $('#errMsg').textContent = '';
      $('#btnLogin').disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: $('#username').value.trim(),
            password: $('#password').value
          })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.message || 'Login failed (' + res.status + ')');
        }

        location.href = data.redirect || '/';
      } catch (err) {
        $('#errMsg').textContent = err.message;
      } finally {
        $('#btnLogin').disabled = false;
      }
    }
  </script>
</body>
</html>
