<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | Marudham Smart City Waste Collection Optimization System</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap');

    :root {
      --bg: #f3f6f4;
      --card: #ffffff;
      --line: #e2e8e5;
      --text: #111e19;
      --text-muted: #53645c;
      --primary: #047857;
      --primary-hover: #065f46;
      --primary-light: #ecfdf5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .signup-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 36px 32px;
      width: min(440px, 100%);
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .brand-icon {
      width: 44px; height: 44px;
      background: var(--primary);
      color: #fff;
      border-radius: 12px;
      display: grid; place-items: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .brand-header b { font-family: 'Manrope', sans-serif; font-size: 18px; display: block; color: var(--text); }
    .brand-header small { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

    h1 {
      font-family: 'Manrope', sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }
    p.sub {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }
    input, select {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 14px;
      outline: none;
      background: #fff;
      transition: border-color 0.15s;
    }
    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(4,120,87,0.1);
    }

    .pw-meter {
      height: 4px;
      background: #e2e8e5;
      border-radius: 2px;
      margin-top: -8px;
      margin-bottom: 14px;
      overflow: hidden;
    }
    .pw-meter-bar {
      height: 100%;
      width: 0%;
      transition: all 0.2s;
    }

    button.btn-signup {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 6px;
    }
    button.btn-signup:hover { background: var(--primary-hover); }
    button.btn-signup:disabled { opacity: 0.6; cursor: not-allowed; }

    .err-msg {
      color: #dc2626;
      font-size: 12.5px;
      margin-top: 12px;
      min-height: 18px;
      text-align: center;
      font-weight: 500;
    }

    .foot-link {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }
    .foot-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .foot-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <form class="signup-card" id="signupForm" onsubmit="handleSignup(event)">
    <div class="brand-header">
      <div class="brand-icon">♻</div>
      <div>
        <b>Marudham Smart City</b>
        <small>MUNICIPAL PORTAL</small>
      </div>
    </div>

    <h1>Create an Account</h1>
    <p class="sub">Register to request waste collection or access municipality operations.</p>

    <div>
      <label for="fullName">Full Name</label>
      <input id="fullName" placeholder="e.g. Kavitha Sundaram" autocomplete="name" required>
    </div>

    <div>
      <label for="username">Username (letters, numbers, dot, dash)</label>
      <input id="username" placeholder="e.g. kavitha_s" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_.-]+">
    </div>

    <div id="roleSelectBox">
      <label for="role">Account Role</label>
      <select id="role">
        <option value="USER" selected>Citizen / Resident</option>
        <option value="DRIVER">Municipal Truck Driver</option>
        <option value="ADMIN">Municipal Administrator</option>
      </select>
    </div>

    <div>
      <label for="password">Password (min 8 characters)</label>
      <input id="password" type="password" required minlength="8" oninput="checkStrength()">
      <div class="pw-meter"><div class="pw-meter-bar" id="pwBar"></div></div>
    </div>

    <div>
      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" type="password" required>
    </div>

    <button class="btn-signup" type="submit" id="btnSignup">Create Account →</button>
    <div class="err-msg" id="errMsg"></div>

    <div class="foot-link">
      Already have an account? <a href="/login.html">Sign In</a>
    </div>
  </form>

  <script>
    const $ = s => document.querySelector(s);

    function checkStrength() {
      const p = $('#password').value;
      let score = 0;
      if (p.length >= 8) score++;
      if (/[A-Z]/.test(p) && /[a-z]/.test(p)) score++;
      if (/\d/.test(p)) score++;
      if (/[^A-Za-z0-9]/.test(p)) score++;

      const bar = $('#pwBar');
      bar.style.width = (score * 25) + '%';
      const colors = ['#dc2626', '#f59e0b', '#3b82f6', '#10b981'];
      bar.style.background = colors[score - 1] || '#dc2626';
    }

    async function handleSignup(e) {
      e.preventDefault();
      $('#errMsg').textContent = '';

      const p1 = $('#password').value;
      const p2 = $('#confirmPassword').value;
      if (p1 !== p2) {
        $('#errMsg').textContent = 'Passwords do not match.';
        return;
      }

      $('#btnSignup').disabled = true;

      try {
        const body = {
          fullName: $('#fullName').value.trim(),
          username: $('#username').value.trim(),
          password: p1,
          role: $('#role').value
        };

        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.message || 'Registration failed (' + res.status + ')');
        }

        // Auto login
        const loginRes = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: body.username, password: body.password })
        });
        const loginData = await loginRes.json().catch(() => ({}));

        location.href = loginRes.ok ? (loginData.redirect || '/') : '/login.html';
      } catch (err) {
        $('#errMsg').textContent = err.message;
      } finally {
        $('#btnSignup').disabled = false;
      }
    }
  </script>
</body>
</html>
